[package]
name = "hdbserver"
version = { workspace = true }
publish = { workspace = true }
edition = "2021"

[dependencies]
anyhow = "1.0.75"
base64 = "0.22.0"
bytes = "1.10.0"
clap = { version = "4.5.0", features = ["cargo", "derive", "env"] }
form_urlencoded = "1.2.0"
futures = "0.3.28"
hex = "0.4"
http-body-util = { workspace = true }
hyper = { workspace = true }
pin-project = "1.1.3"
reqwest = { version = "0.12.7", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10.8"
thiserror = "2.0.3"
time = "0.3.28"
tokio = { version = "1.45.1", features = ["full"] }
toml = "0.8.12"
tracing = { workspace = true }
yubico = { git = "https://github.com/SecureDNA/yubico-rs", rev = "00df14811f58155c0f02e3ab10f1570ed3e115c6" }

certificates = { path = "../certificates" }
doprf = { path = "../doprf" }
hdb = { path = "../hdb" }
hdb_api = { path = "../hdb_api" }
http_client = { path = "../http_client" }
minhttp = { path = "../minhttp" }
persistence = { path = "../persistence" }
scep = { path = "../scep" }
scep_server_helpers = { path = "../scep_server_helpers" }
securedna_versioning = { path = "../securedna_versioning" }
shared_types = { path = "../shared_types", features = ["http"] }
streamed_ristretto = { path = "../streamed_ristretto", features = ["hyper"] }
tracing_defaults = { path = "../tracing_defaults" }

[dev-dependencies]
tempfile = { workspace = true }
totp-rs = "5.7.0"

scep_client_helpers = { path = "../scep_client_helpers" }

[features]
run_network_tests = []
