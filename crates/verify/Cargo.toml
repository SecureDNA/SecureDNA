[package]
name = "verify"
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
bytes = "1.11.1"
hex = "0.4.3"
quickdna = { workspace = true, default-features = false }
reqwest = { version = "0.12.7", features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
sha3 = "0.10.8"
thiserror = "2.0.3"
time = "0.3"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] } # Added tokio features for the binary
clap = { version = "4.5.60", features = ["derive"] } # Added clap for the binary

certificates = { path = "../certificates" }
doprf_client = { path = "../doprf_client" }
hdb_api = { path = "../hdb_api" }
scep_client_helpers = { path = "../scep_client_helpers" }
shared_types = { path = "../shared_types" }
synthclient = { path = "../synthclient" }

[lib]
name = "verify"
path = "src/lib.rs"

[[bin]]
name = "sdna-verify"
path = "src/bin/verify.rs"

