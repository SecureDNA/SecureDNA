[package]
name = "synthclient"
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
edition = "2024"

[features]
default = ["native"]
native = [
  "clap",
  "prometheus",
]
wasm = [
  "again/wasm-bindgen",
  "getrandom/js",
  "js-sys",
  "wasm-bindgen-futures",
  "wasm-bindgen",
  "web-sys",
]
[[bin]]
name = "synthclient"
required-features = ["native"]

[dependencies]
again = { workspace = true }
anyhow = "1.0.75"
bytes = "1.11.1"
clap = { version = "4.5.60", features = ["derive", "cargo", "env"], optional = true }
futures = "0.3.28"
getrandom = "0.2"
hex = "0.4"
itertools = "0.14.0"
prometheus = { version = "0.14.0", optional = true }
quickdna = { workspace = true, default-features = false }
serde = "^1"
serde_json = "^1"
sha3 = "0.10.8"
thiserror = "2.0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
uuid = { version = "1.23.1", features = ["v4", "js"] }

certificates = { path = "../certificates" }
doprf = { path = "../doprf" }
doprf_client = { path = "../doprf_client" }
hdb_api = { path = "../hdb_api" }
http_client = { path = "../http_client" }
pipeline_bridge = { path = "../pipeline_bridge" }
scep_client_helpers = { path = "../scep_client_helpers" }
securedna_versioning = { path = "../securedna_versioning" }
shared_types = { path = "../shared_types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
form_urlencoded = "1.2.0"
http-body-util = { workspace = true }
hyper = { workspace = true }
minhttp = { path = "../minhttp" }
regex = "1.11.0"
reqwest = { version = "0.12.7", features = ["rustls-tls"] }
tracing = { workspace = true }
time = "0.3.47"
url = "2.5.0"

persistence = { path = "../persistence" }
shared_types = { path = "../shared_types", features = ["http"] }
tracing_defaults = { path = "../tracing_defaults" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.64", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.64"
optional = true
features = [
  "console",
  "Blob",
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
]

[dev-dependencies]
assert-json-diff = "2.0.2"
quickcheck = "1.0"
quickdna = { workspace = true, features = ["quickcheck"] }
