[package]
name = "http_client"
edition = "2024"
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2.5.0"
bytes = "1"
futures = "0.3.27"
http = "1.1.0"
http-body-util = { workspace = true }
hyper = { workspace = true }
pin-project = "1.1.3"
reqwest = { version = "0.12.7", features = ["cookies", "json", "rustls-tls"] }
serde = "1"
serde_json = "1"
thiserror = "2.0.3"
tracing = { workspace = true }
zerocopy = "0.8.14"

streamed_ristretto = { path = "../streamed_ristretto", features = ["reqwest"] }
packed_ristretto = { path = "../packed_ristretto", default-features = false }
shared_types = { path = "../shared_types" }
format_serde_error = { version = "0.3.0", default-features = false, features = ["serde_json", "graphemes_support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.64" }
serde-wasm-bindgen = "0.6.0"
wasm-bindgen = { version = "0.2.100" }
wasm-bindgen-futures = { version = "0.4.50" }
web-sys = { version = "0.3.64", features = [
  "DedicatedWorkerGlobalScope",
  "Headers",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
] }

streamed_ristretto = { path = "../streamed_ristretto", features = ["web-sys"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
zerocopy = { version = "0.8.14", features = ["derive"] }
